services:
  service-staging:
    image: ${IMAGE_TAG:-distributed-priority-queue-service:local}
    profiles: ["staging"]
    ports:
      - "8080:8080"
    environment:
      PORT: 8080

  service-prod:
    image: ${IMAGE_TAG:-distributed-priority-queue-service:local}
    profiles: ["prod"]
    ports:
      - "8081:8080"
    environment:
      PORT: 8080
